<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0f">
    <title>FlashReview</title>
    <meta name="description"
        content="Seu app completo de estudos para concursos — Flashcards, Quiz, Questões, Resumos e mais.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Status Bar Spacer -->
    <div class="status-bar-spacer"></div>

    <!-- App Header -->
    <header class="app-header" id="app-header">
        <div class="header-left">
            <div class="app-logo">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div class="header-title">
                <h1>FlashReview</h1>
                <span class="header-subtitle">Área de Membros</span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-icon-btn" id="notification-btn" aria-label="Notificações">
                <i class="fa-solid fa-bell"></i>
                <span class="notification-dot"></span>
            </button>
        </div>
    </header>

    <!-- Banner Compacto -->
    <section class="app-banner" id="app-banner">
        <div class="banner-wrapper">
            <img src="banner.webp" alt="Banner FlashReview" class="banner-image">
            <div class="banner-overlay"></div>
        </div>
    </section>

    <!-- Content -->
    <main class="app-content" id="app-content">
        <!-- Quick Access Grid -->
        <section class="section-block">
            <div class="section-title">
                <span class="section-label">Acesso Rápido</span>
                <span class="section-badge">Principal</span>
            </div>
            <a href="https://www.blacknous.com/m/info/cards" target="_blank" class="featured-card" id="featured-app">
                <div class="featured-icon-wrap">
                    <div class="featured-icon">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <div class="featured-pulse"></div>
                </div>
                <div class="featured-info">
                    <h2>App Flash Review</h2>
                    <p>Acesse o aplicativo principal de estudos</p>
                </div>
                <div class="featured-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>
        </section>

        <!-- Bônus Section -->
        <section class="section-block">
            <div class="section-title">
                <span class="section-label">Materiais Bônus</span>
                <span class="section-count">5 itens</span>
            </div>

            <div class="bonus-grid">
                <a href="https://www.blacknous.com/m/info/50q" target="_blank" class="bonus-card" id="bonus-50q"
                    style="--delay: 0.05s">
                    <div class="bonus-icon" style="--icon-color: #f59e0b; --icon-bg: rgba(245, 158, 11, 0.12)">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <span class="bonus-label">50 Questões</span>
                    <span class="bonus-tag">Bônus 1</span>
                </a>
                <a href="https://www.blacknous.com/m/info/res" target="_blank" class="bonus-card" id="bonus-res"
                    style="--delay: 0.1s">
                    <div class="bonus-icon" style="--icon-color: #10b981; --icon-bg: rgba(16, 185, 129, 0.12)">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <span class="bonus-label">Resumo</span>
                    <span class="bonus-tag">Bônus 2</span>
                </a>
                <a href="https://www.blacknous.com/m/info/quizz" target="_blank" class="bonus-card" id="bonus-quizz"
                    style="--delay: 0.15s">
                    <div class="bonus-icon" style="--icon-color: #8b5cf6; --icon-bg: rgba(139, 92, 246, 0.12)">
                        <i class="fa-solid fa-clipboard-question"></i>
                    </div>
                    <span class="bonus-label">Quizz</span>
                    <span class="bonus-tag">Bônus 3</span>
                </a>
                <a href="https://www.blacknous.com/m/info/cards" target="_blank" class="bonus-card" id="bonus-cards"
                    style="--delay: 0.2s">
                    <div class="bonus-icon" style="--icon-color: #3b82f6; --icon-bg: rgba(59, 130, 246, 0.12)">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <span class="bonus-label">Flashcards</span>
                    <span class="bonus-tag">Bônus 4</span>
                </a>
                <a href="https://www.blacknous.com/m/info/dic" target="_blank" class="bonus-card" id="bonus-dic"
                    style="--delay: 0.25s">
                    <div class="bonus-icon" style="--icon-color: #ec4899; --icon-bg: rgba(236, 72, 153, 0.12)">
                        <i class="fa-solid fa-book"></i>
                    </div>
                    <span class="bonus-label">Dicionário</span>
                    <span class="bonus-tag">Bônus 5</span>
                </a>
            </div>
        </section>

        <!-- Footer inline -->
        <div class="app-footer-text">
            <p>Feito com ❤️ Blacknous</p>
        </div>
    </main>



    <script>
        // Scroll effect: shrink header on scroll
        const header = document.getElementById('app-header');
        const banner = document.getElementById('app-banner');
        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;

            if (scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }

            // Parallax on banner
            if (banner) {
                const bannerHeight = banner.offsetHeight;
                const progress = Math.min(scrollY / bannerHeight, 1);
                banner.style.opacity = 1 - progress * 0.6;
                banner.style.transform = `translateY(${scrollY * 0.3}px)`;
            }

            lastScroll = scrollY;
        });

        // Haptic-style tap animation for cards
        document.querySelectorAll('.bonus-card, .featured-card, .nav-item').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.95)';
            }, { passive: true });
            el.addEventListener('touchend', () => {
                el.style.transform = '';
            }, { passive: true });
        });

        // Animate elements on scroll
        const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -40px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.bonus-card, .section-block, .featured-card').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>

</html>
